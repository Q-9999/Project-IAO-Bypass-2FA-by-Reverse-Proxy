# ==============================================================================
# LAB DNS SERVER CONFIGURATION (dnsmasq)
# ==============================================================================

# 1. Cổng lắng nghe (Port)
# Cổng 5353 cho phép chạy ở quyền user thông thường mà không cần sudo
# (Khi triển khai chính thức cho toàn mạng, đổi thành port=53)
port=5353

# 2. Giao diện mạng lắng nghe (Interface & IP)
listen-address=127.0.0.1
bind-interfaces

# 3. Không sử dụng file /etc/resolv.conf và /etc/hosts mặc định của hệ thống
no-resolv
no-hosts

# 4. Máy chủ DNS cấp trên (Upstream DNS Forwarders)
# Khi truy vấn các domain internet thông thường (google.com, github.com),
# máy chủ sẽ chuyển tiếp lên các DNS server này:
server=1.1.1.1
server=8.8.8.8

# 5. Ghi log truy vấn (Logging) để quan sát luồng bắt gói DNS
log-queries
log-facility=-

# ==============================================================================
# CÁC BẢN GHI PHÂN GIẢI NỘI BỘ (Local DNS Records)
# ==============================================================================

# Bản ghi A cho hệ thống nội bộ công ty MMQ
address=/mmq.khanh/127.0.0.1
address=/auth.mmq.khanh/127.0.0.1
address=/mail.mmq.khanh/127.0.0.1
address=/portal.mmq.khanh/127.0.0.1

# Bản ghi cho tên miền Reverse Proxy giả mạo trong kịch bản AiTM
address=/login.microsoft-sso.mmq-portal.cloud/127.0.0.1
address=/auth-portal.mmq-corp.cloud/127.0.0.1

# Bản ghi TXT (thường dùng để xác thực quyền sở hữu domain hoặc cấu hình SPF)
txt-record=mmq.khanh,"v=spf1 include:_spf.mmq.khanh ~all"
txt-record=_acme-challenge.mmq.khanh,"CHALLENGE_VERIFICATION_TOKEN_ABC123"
