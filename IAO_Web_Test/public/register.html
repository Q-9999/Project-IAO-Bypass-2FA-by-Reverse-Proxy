<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Create account</title><link rel="stylesheet" href="/assets/style.css"></head>
<body><main class="shell">
<a class="brand" href="/"><span class="mark"></span><span class="app-name">Northgate</span></a>
<section class="card">
<h1>Create your account</h1><p class="sub">Verify your email to finish signing up.</p>
<div id="msg" class="alert" role="alert" aria-live="polite" hidden></div>
<form id="register-form" novalidate>
<div class="field"><label for="username">Username</label><input type="text" id="username" name="username" autocomplete="username" autocapitalize="none" maxlength="24" required><p class="hint">3–24 letters, numbers or underscores.</p></div>
<div class="field"><label for="email">Email address</label><div class="input-row"><input type="email" id="email" name="email" autocomplete="email" required><button type="button" id="send-code" class="btn ghost small">Send verification code</button></div></div>
<div class="field"><label for="code">Verification code</label><input class="code" type="text" id="code" name="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="••••••" required></div>
<div class="field"><label for="password">Password</label><div class="input-row"><input type="password" id="password" name="password" autocomplete="new-password" required><button type="button" class="btn ghost small" data-toggle-pw="password" aria-pressed="false" style="width:72px">Show</button></div></div>
<p class="hint" style="margin:-8px 0 16px">At least 10 characters with a letter and a number.</p>
<div class="field"><label for="confirmPassword">Confirm password</label><div class="input-row"><input type="password" id="confirmPassword" name="confirmPassword" autocomplete="new-password" required><button type="button" class="btn ghost small" data-toggle-pw="confirmPassword" aria-pressed="false" style="width:72px">Show</button></div></div>
<button class="btn full" id="register-btn" type="submit">Register</button>
<p class="foot">Already have an account? <a href="/login">Log in</a></p>
</form></section>
</main>
<script src="/assets/app.js"></script>
<script src="/assets/register.js"></script>
</body></html>
